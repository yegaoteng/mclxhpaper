# =============================================================
# LuoXiaoHeiAbilities v2.0 主配置
# =============================================================

# 修炼系统 (5阶)
cultivation:
  xp-per-kill: 20
  # 升阶条件: 灵力满 + 经验达到要求
  levels:
    1:
      max-spiritual: 1000
      regen-per-second: 2
      xp-to-next: 7500
    2:
      max-spiritual: 2000
      regen-per-second: 3
      xp-to-next: 20000
    3:
      max-spiritual: 3500
      regen-per-second: 5
      xp-to-next: 50000
    4:
      max-spiritual: 7000
      regen-per-second: 7
      xp-to-next: 100000
    5:
      max-spiritual: 10000
      regen-per-second: 10
      bonus-health: 20
      xp-to-next: 0

# HUD 显示 (右侧计分板)
hud:
  enabled: true
  update-interval: 10  # tick

# 按键绑定
keybinds:
  # 可选: SNEAK(Shift键), SWAP_HANDS(F键), SHIFT_SWAP(Shift+F), DROP(Q键), SHIFT_DROP(Shift+Q)
  # 注意: Bukkit无法检测M/Alt/Ctrl等键, Shift是最接近单键的选择
  default-cycle: SNEAK
  default-toggle: SWAP_HANDS

# 灵力恢复
spiritual:
  death-keep-percent: 50
  # 灵块倍率系统
  spirit-block-radius: 5
  spirit-block-max-layers: 16
  # 灵瓜恢复量
  spirit-melon-restore: 750

# 灵矿配置 (v2.4.6: 控制矿量+刷新可见+防过量生成)
spirit-ore:
  enabled: true
  # 灵矿方块: 铁矿(浅层y>=0) + 深板岩铁矿(深层y<0)
  # 附魔光效: 由END_ROD粒子模拟 (玩家附近32格内会闪烁)
  spawn-rate: iron
  min-height: -58      # 1.21深板岩层底部
  max-height: 32       # 真正矿洞深度,避开地表
  max-vein-size: 4     # 最大矿脉大小(1~4),铁矿级别
  attempts-per-chunk: 6 # 每区块6次尝试,对应MC铁矿级别 (每区块约10~20个灵矿)

# 能力开关
abilities:
  metal-enabled: true
  space-enabled: true
  fire-enabled: true
  thunder-enabled: true
  wood-enabled: true

# 性能优化
performance:
  async-processing: true
  devour-queue-max: 500
  hud-update-interval: 10
  regen-check-interval: 20
  ore-cache-ttl: 100
  ore-glow-interval: 30  # 灵矿发光粒子间隔(tick)

# 权限节点
permissions:
  give-spiritual: ability.admin
  give-xp: ability.admin
  bind: ability.use
